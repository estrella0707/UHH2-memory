{{ block title }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
{{ endblock }}

{{ block content }}

<div>
    <h3>Count the black balls in cell: <span id="cellLabel"></span></h3>
    <img src="/static/CountBlackBall.png" width="1000px">
    <br><br>

    <input id="answer" type="number" autocomplete="off">
    <button type="button" onclick="submitAnswer()">Submit</button>

    <p id="feedback" style="color:red;"></p>
    <p>Score: <span id="score">0</span></p>
</div>



<script>
let currentCell = null;

function newQuestion(data) {
    currentCell = data.cell;

    document.getElementById("cellLabel").innerHTML = currentCell;
    document.getElementById("feedback").innerHTML = "";
}

function submitAnswer() {
    let answer = parseInt(document.getElementById("answer").value);

    liveSend({
        type: "answer",
        cell: currentCell,
        answer: answer
    });
}

function liveRecv(data) {
    document.getElementById("score").innerHTML = data.score;

    if (data.correct) {
        document.getElementById("answer").value = "";
        newQuestion(data);
    } else {
        document.getElementById("feedback").innerHTML =
            "This answer is incorrect. Please try again.";
        document.getElementById("answer").value = "";
    }
}

// initialization
document.addEventListener("DOMContentLoaded", function () {
    liveSend({type: "start"});
});
</script>

{{ endblock }}
