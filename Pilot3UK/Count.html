{{ block title }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
{{ endblock }}

{{ block content }}

<div>
    <h3>Count the black balls in cell: <span id="cellLabel"></span></h3>
    <img src="/static/CountBlackBall.png" width="800px">
    <br><br>

    <input id="answer" type="number" autocomplete="off">
    <button type="button" onclick="submitAnswer()">Submit</button>
</div>



<script>
let currentCell = null;

function newQuestion(data) {
    currentCell = data.cell;
    document.getElementById("cellLabel").innerHTML = currentCell;
}

function submitAnswer() {
    let answer = parseInt(document.getElementById("answer").value);

    liveSend({
        type: "answer",
        cell: currentCell,
        answer: answer
    });
}

function liveRecv(data) {
    document.getElementById("answer").value = "";
    newQuestion(data);
}

// initialization
document.addEventListener("DOMContentLoaded", function () {
    liveSend({type: "start"});
});
</script>

{{ endblock }}
