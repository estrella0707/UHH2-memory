{{ block content }}
<p>Please read the following slides carefully.</p>

<img src="{{ static 'Pilot2UK/Slide1.PNG' }}" alt="info image" style="max-width: 80%; height: auto; display: block;" class="mx-auto">

{{ block scripts }}
    <script>
        // After 5 seconds, display the "Next" button

        document.getElementById('next-button').style.display = 'block';
        }, 5 * 1000);
    </script>
{{ endblock }}
