{{ block title }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
{{ endblock }}

{{ block content }}
<p>Please read the following slides carefully. Each page will be displayed for at least 5 seconds before you can proceed to the next one.</p>

<img src="{{ static image }}" alt="info image" style="max-width: 80%; height: auto; display: block;" class="mx-auto">
<br>

<button class="btn btn-primary" style="display: none" id="next-button">Next</button>

{{ endblock }}

{{ block scripts }}
    <script>
        // After 5 seconds, display the "Next" button
        setTimeout(function() {
        document.getElementById('next-button').style.display = 'block';
        }, 5 * 1000);
    </script>
{{ endblock }}
