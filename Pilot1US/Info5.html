{{ block title }}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
{{ endblock }}

{{ block content }}
<img src="{{ static image }}" alt="info picture" style="max-width: 80%; height: auto; display: block;" class="mx-auto">
<br>

{% if player.task == 'simple_hope' or player.task == 'complex_hope' %}
<p>
    <button class="btn btn-success" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
        Click to check the typical price of alarm systems in the US if you wish
    </button>
</p>
<div class="collapse" id="collapseExample">
    Price range: $150 - $250
</div>
{% endif %}
<br>

<button class="btn btn-primary" style="display: none" id="next-button">Next</button>
{{ endblock }}

{{ block scripts }}
    <script>
        // After 5 seconds, display the "Next" button
        setTimeout(function() {
        document.getElementById('next-button').style.display = 'block';
        }, 5 * 1000);
    </script>
{{ endblock }}
